<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RF1 — Rabbit R1 Install QR Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-white p-6 flex flex-col items-center justify-center">
  <div class="max-w-md w-full bg-neutral-900 border border-neutral-800 rounded-xl p-6 shadow-2xl">
    <div class="flex items-center gap-3 mb-4">
      <span class="w-3 h-3 rounded-full bg-[#FE5000] animate-pulse"></span>
      <h1 class="text-xl font-bold tracking-wide">RF1 — Install QR Generator</h1>
    </div>
    <p class="text-xs text-neutral-400 mb-6">
      Enter the public HTTPS URL where RF1 is hosted. Scan the generated QR code with your Rabbit R1 camera to install.
    </p>

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-xs font-semibold text-neutral-300 mb-1">Hosted App URL (HTTPS)</label>
        <input id="appUrl" type="url" value="https://anxand.github.io/RF1/" 
               class="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm text-white focus:outline-none focus:border-[#FE5000]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-neutral-300 mb-1">Creation Title</label>
        <input id="appTitle" type="text" value="RF1" 
               class="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm text-white focus:outline-none focus:border-[#FE5000]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-neutral-300 mb-1">Description</label>
        <input id="appDesc" type="text" value="Formula 1 pit-wall telemetry companion and live dashboard for Rabbit R1" 
               class="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm text-white focus:outline-none focus:border-[#FE5000]">
      </div>

      <button id="genBtn" class="w-full py-2.5 bg-[#FE5000] hover:bg-[#ff6a1a] text-white font-bold rounded-lg text-sm transition">
        Generate R1 QR Code
      </button>
    </div>

    <!-- QR Container -->
    <div class="flex flex-col items-center justify-center p-4 bg-white rounded-lg min-h-[220px]" id="qrCanvas">
      <span class="text-xs text-neutral-500 font-medium">QR code will appear here</span>
    </div>
  </div>

  <script>
    const qrCode = new QRCodeStyling({
      width: 200,
      height: 200,
      type: "svg",
      data: "",
      dotsOptions: {
        color: "#FE5000",
        type: "rounded"
      },
      cornersSquareOptions: {
        color: "#000000",
        type: "extra-rounded"
      },
      backgroundOptions: {
        color: "#ffffff"
      }
    });

    function generate() {
      const url = document.getElementById('appUrl').value.trim() || window.location.origin;
      const title = document.getElementById('appTitle').value.trim() || 'RF1';
      const desc = document.getElementById('appDesc').value.trim() || 'Formula 1 telemetry companion for Rabbit R1';

      const payload = {
        title: title,
        url: url,
        description: desc,
        iconUrl: "https://raw.githubusercontent.com/rabbit-hmi-oss/creations-sdk/main/plugin-demo/favicon.ico",
        themeColor: "#FE5000"
      };

      const qrContainer = document.getElementById('qrCanvas');
      qrContainer.innerHTML = '';
      qrCode.update({
        data: JSON.stringify(payload)
      });
      qrCode.append(qrContainer);
    }

    document.getElementById('genBtn').addEventListener('click', generate);
    generate();
  </script>
</body>
</html>
